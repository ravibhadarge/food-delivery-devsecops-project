name: DevSecOps Pipeline - Food Delivery (Production)

# ═══════════════════════════════════════════════════════════════════
# PRODUCTION LEVEL PIPELINE
# - Docker Hub for container images
# - ALL application secrets from AWS Secrets Manager
# - OIDC authentication for AWS (no static AWS keys)
# - SonarQube running on bastion server
# - 10 stages
#
# TRIGGERS:
#   - PR to main    → Runs scan stages (1-6) only, no deploy
#   - Manual dispatch → scan-only OR full deploy
#   - Push to main  → Runs scan stages
# ═══════════════════════════════════════════════════════════════════

on:
  push:
    branches: [main]
    paths-ignore:
      - "terraform/**"
      - "*.md"
      - ".github/dependabot.yml"

  pull_request:
    branches: [main]
    paths-ignore:
      - "terraform/**"
      - "*.md"

  workflow_dispatch:
    inputs:
      action:
        description: "What do you want to do?"
        required: true
        default: "scan-only"
        type: choice
        options:
          - scan-only
          - deploy

# ═══════════════════════════════════════════════════════════════════
# GLOBAL VARIABLES
# ═══════════════════════════════════════════════════════════════════

env:
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}

  DOCKERHUB_REPOSITORY_BACKEND: food-delivery-backend
  DOCKERHUB_REPOSITORY_FRONTEND: food-delivery-frontend
  DOCKERHUB_REPOSITORY_ADMIN: food-delivery-admin

  EKS_CLUSTER_NAME: food-delivery-cluster

  IMAGE_TAG: v${{ github.run_number }}

# ═══════════════════════════════════════════════════════════════════
# GITHUB TOKEN PERMISSIONS
# ═══════════════════════════════════════════════════════════════════

permissions:
  id-token: write
  contents: read
  security-events: write
  pull-requests: write

jobs:

  # ═══════════════════════════════════════════════════════════════════
  # STAGE 1: SECRET SCANNING
  # ═══════════════════════════════════════════════════════════════════

  secret-scan:
    name: "Stage 1: Secret Scanning (Gitleaks)"
    runs-on: ubuntu-latest

    if: github.actor != 'dependabot[bot]'

    steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ═══════════════════════════════════════════════════════════════════
  # STAGE 2: SAST — SONARQUBE
  # Secrets retrieved from AWS Secrets Manager
  # ═══════════════════════════════════════════════════════════════════

  sast-scan:
    name: "Stage 2: SAST (SonarQube)"
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Get SonarQube secrets from AWS Secrets Manager
        id: sonar-secrets
        shell: bash
        run: |
          set -e

          SECRETS=$(aws secretsmanager get-secret-value \
            --secret-id food-delivery/pipeline \
            --query SecretString \
            --output text)

          echo "SONAR_TOKEN=$(echo "$SECRETS" | jq -r '.SONAR_TOKEN')" >> "$GITHUB_ENV"
          echo "SONAR_HOST_URL=$(echo "$SECRETS" | jq -r '.SONAR_HOST_URL')" >> "$GITHUB_ENV"

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}


  # ═══════════════════════════════════════════════════════════════════
  # STAGE 3: DEPENDENCY SCAN — TRIVY FILESYSTEM
  # ═══════════════════════════════════════════════════════════════════

  dependency-scan:
    name: "Stage 3: Dependency Scan (Trivy FS)"
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trivy Filesystem Scan - Backend
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "./backend"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"

      - name: Trivy Filesystem Scan - Frontend
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "./frontend"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"

      - name: Trivy Filesystem Scan - Admin
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "./admin"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"


  # ═══════════════════════════════════════════════════════════════════
  # STAGE 4: BUILD DOCKER IMAGES
  # Docker Hub image names
  # ═══════════════════════════════════════════════════════════════════

  build-images:
    name: "Stage 4: Build Docker Images"
    runs-on: ubuntu-latest

    needs:
      - secret-scan
      - sast-scan
      - dependency-scan

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ─────────────────────────────────────────────────────────────
      # Backend
      # ─────────────────────────────────────────────────────────────

      - name: Build Backend Image
        run: |
          docker build \
            -t ${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY_BACKEND }}:${{ env.IMAGE_TAG }} \
            ./backend

      # ─────────────────────────────────────────────────────────────
      # Frontend
      # ─────────────────────────────────────────────────────────────

      - name: Build Frontend Image
        run: |
          docker build \
            -t ${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY_FRONTEND }}:${{ env.IMAGE_TAG }} \
            ./frontend

      # ─────────────────────────────────────────────────────────────
      # Admin
      # ─────────────────────────────────────────────────────────────

      - name: Build Admin Image
        run: |
          docker build \
            -t ${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY_ADMIN }}:${{ env.IMAGE_TAG }} \
            ./admin

      # ─────────────────────────────────────────────────────────────
      # Save images
      # ─────────────────────────────────────────────────────────────

      - name: Save images for next stages
        run: |
          docker save \
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY_BACKEND }}:${{ env.IMAGE_TAG }} \
            -o backend-image.tar

          docker save \
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY_FRONTEND }}:${{ env.IMAGE_TAG }} \
            -o frontend-image.tar

          docker save \
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY_ADMIN }}:${{ env.IMAGE_TAG }} \
            -o admin-image.tar

      - name: Upload image artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: |
            backend-image.tar
            frontend-image.tar
            admin-image.tar
          retention-days: 1


  # ═══════════════════════════════════════════════════════════════════
  # STAGE 5: CONTAINER IMAGE SCAN — TRIVY
  # ═══════════════════════════════════════════════════════════════════

  image-scan:
    name: "Stage 5: Container Image Scan (Trivy)"
    runs-on: ubuntu-latest

    needs:
      - build-images

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download image artifacts
        uses: actions/download-artifact@v8
        with:
          name: docker-images

      - name: Load images
        run: |
          docker load -i backend-image.tar
          docker load -i frontend-image.tar
          docker load -i admin-image.tar

      # ─────────────────────────────────────────────────────────────
      # Backend scan
      # ─────────────────────────────────────────────────────────────

      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY_BACKEND }}:${{ env.IMAGE_TAG }}"
          format: "sarif"
          output: "trivy-backend.sarif"
          exit-code: "0"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          scanners: "vuln"
          trivyignores: ".trivyignore"

      # ─────────────────────────────────────────────────────────────
      # Frontend scan
      # ─────────────────────────────────────────────────────────────

      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY_FRONTEND }}:${{ env.IMAGE_TAG }}"
          format: "sarif"
          output: "trivy-frontend.sarif"
          exit-code: "0"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          scanners: "vuln"

      # ─────────────────────────────────────────────────────────────
      # Admin scan
      # ─────────────────────────────────────────────────────────────

      - name: Scan Admin Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY_ADMIN }}:${{ env.IMAGE_TAG }}"
          format: "sarif"
          output: "trivy-admin.sarif"
          exit-code: "0"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          scanners: "vuln"

      # ─────────────────────────────────────────────────────────────
      # Upload SARIF results
      # ─────────────────────────────────────────────────────────────

      - name: Upload Trivy Backend SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-backend.sarif"
          category: "trivy-backend"

      - name: Upload Trivy Frontend SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-frontend.sarif"
          category: "trivy-frontend"

      - name: Upload Trivy Admin SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-admin.sarif"
          category: "trivy-admin"


  # ═══════════════════════════════════════════════════════════════════
  # STAGE 6: IaC SECURITY SCAN — CHECKOV
  # ═══════════════════════════════════════════════════════════════════

  iac-scan:
    name: "Stage 6: IaC Scan (Checkov)"
    runs-on: ubuntu-latest

    needs:
      - build-images

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────────────────────
      # Kubernetes manifests
      # ─────────────────────────────────────────────────────────────

      - name: Checkov - Scan Kubernetes manifests
        uses: bridgecrewio/checkov-action@master
        with:
          directory: k8s/
          framework: kubernetes
          output_format: sarif
          soft_fail: false

          # CKV_K8S_43:
          # Images use dynamic tags generated by GitHub Actions.

          # CKV_K8S_35:
          # Secrets are injected from AWS Secrets Manager.

          # CKV_K8S_22:
          # MongoDB requires writable /data/db.

          skip_check: "CKV_K8S_43,CKV_K8S_35,CKV_K8S_22"

      # ─────────────────────────────────────────────────────────────
      # Dockerfile
      # ─────────────────────────────────────────────────────────────

      - name: Checkov - Scan Backend Dockerfile
        uses: bridgecrewio/checkov-action@master
        with:
          file: backend/Dockerfile
          framework: dockerfile
          soft_fail: true
          skip_check: "CKV_DOCKER_2,CKV_DOCKER_7"


  # ═══════════════════════════════════════════════════════════════════
  # STAGE 7: PUSH TO DOCKER HUB
  # ═══════════════════════════════════════════════════════════════════

  push-to-dockerhub:
    name: "Stage 7: Push to Docker Hub"
    runs-on: ubuntu-latest

    needs:
      - image-scan
      - iac-scan

    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.action == 'deploy'

    steps:

      - name: Download image artifacts
        uses: actions/download-artifact@v8
        with:
          name: docker-images

      - name: Load images
        run: |
          docker load -i backend-image.tar
          docker load -i frontend-image.tar
          docker load -i admin-image.tar

      # ─────────────────────────────────────────────────────────────
      # Docker Hub login
      # ─────────────────────────────────────────────────────────────

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ─────────────────────────────────────────────────────────────
      # Push Backend
      # ─────────────────────────────────────────────────────────────

      - name: Push Backend Image
        run: |
          docker push \
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY_BACKEND }}:${{ env.IMAGE_TAG }}

      # ─────────────────────────────────────────────────────────────
      # Push Frontend
      # ─────────────────────────────────────────────────────────────

      - name: Push Frontend Image
        run: |
          docker push \
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY_FRONTEND }}:${{ env.IMAGE_TAG }}

      # ─────────────────────────────────────────────────────────────
      # Push Admin
      # ─────────────────────────────────────────────────────────────

      - name: Push Admin Image
        run: |
          docker push \
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY_ADMIN }}:${{ env.IMAGE_TAG }}


  # ═══════════════════════════════════════════════════════════════════
  # STAGE 8: DEPLOY TO KUBERNETES / EKS
  #
  # AWS is STILL required here because:
  # - EKS
  # - AWS Secrets Manager
  #
  # Docker images come from Docker Hub.
  # ═══════════════════════════════════════════════════════════════════

  deploy:
    name: "Stage 8: Deploy to EKS"
    runs-on: ubuntu-latest

    needs:
      - push-to-dockerhub

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────────────────────
      # AWS OIDC
      # ─────────────────────────────────────────────────────────────

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # ─────────────────────────────────────────────────────────────
      # Configure kubectl
      # ─────────────────────────────────────────────────────────────

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER_NAME }} \
            --region ${{ vars.AWS_REGION }}

      # ═════════════════════════════════════════════════════════════
      # GET SECRETS FROM AWS SECRETS MANAGER
      # ═════════════════════════════════════════════════════════════

      - name: Fetch app secrets from AWS Secrets Manager
        shell: bash
        run: |
          set -e

          echo "Getting application secrets..."

          SECRETS=$(aws secretsmanager get-secret-value \
            --secret-id food-delivery/app-secrets \
            --query SecretString \
            --output text)

          DB_SECRETS=$(aws secretsmanager get-secret-value \
            --secret-id food-delivery/database \
            --query SecretString \
            --output text)

          MONGODB_URI=$(echo "$SECRETS" | jq -r '.MONGODB_URI')
          JWT_SECRET=$(echo "$SECRETS" | jq -r '.JWT_SECRET')
          STRIPE_KEY=$(echo "$SECRETS" | jq -r '.STRIPE_SECRET_KEY')

          DB_USERNAME=$(echo "$DB_SECRETS" | jq -r '.DB_USERNAME')
          DB_PASSWORD=$(echo "$DB_SECRETS" | jq -r '.DB_PASSWORD')

          echo "Creating Kubernetes namespace..."

          kubectl create namespace food-delivery \
            --dry-run=client \
            -o yaml | kubectl apply -f -

          echo "Replacing Kubernetes secret..."

          kubectl delete secret food-delivery-secrets \
            -n food-delivery \
            --ignore-not-found

          kubectl create secret generic food-delivery-secrets \
            --namespace food-delivery \
            --from-literal=mongodb-uri="$MONGODB_URI" \
            --from-literal=jwt-secret="$JWT_SECRET" \
            --from-literal=stripe-secret-key="$STRIPE_KEY" \
            --from-literal=mongodb-username="$DB_USERNAME" \
            --from-literal=mongodb-password="$DB_PASSWORD"

          echo "Kubernetes secret created successfully."


      # ═════════════════════════════════════════════════════════════
      # PREPARE KUBERNETES MANIFESTS
      # ═════════════════════════════════════════════════════════════

      - name: Prepare Kubernetes manifests
        shell: bash
        run: |
          set -e

          echo "Updating Docker Hub image references..."

          sed -i \
            "s|DOCKERHUB_USERNAME_PLACEHOLDER|${{ env.DOCKERHUB_USERNAME }}|g" \
            k8s/backend-deployment.yaml

          sed -i \
            "s|DOCKERHUB_USERNAME_PLACEHOLDER|${{ env.DOCKERHUB_USERNAME }}|g" \
            k8s/frontend-deployment.yaml

          sed -i \
            "s|DOCKERHUB_USERNAME_PLACEHOLDER|${{ env.DOCKERHUB_USERNAME }}|g" \
            k8s/admin-deployment.yaml

          echo "Updating image tags..."

          sed -i \
            "s|IMAGE_TAG_PLACEHOLDER|${{ env.IMAGE_TAG }}|g" \
            k8s/backend-deployment.yaml

          sed -i \
            "s|IMAGE_TAG_PLACEHOLDER|${{ env.IMAGE_TAG }}|g" \
            k8s/frontend-deployment.yaml

          sed -i \
            "s|IMAGE_TAG_PLACEHOLDER|${{ env.IMAGE_TAG }}|g" \
            k8s/admin-deployment.yaml

          echo "Updating application domain..."




      # ═════════════════════════════════════════════════════════════
      # ═════════════════════════════════════════════════════════════

      - name: Deploy to Kubernetes
        shell: bash
        run: |
          set -e

          echo "Applying Kubernetes manifests..."

          kubectl apply -f k8s/namespace.yaml

          kubectl apply -f k8s/storageclass.yaml

          kubectl apply -f k8s/networkpolicy.yaml

          kubectl apply -f k8s/mongodb-deployment.yaml

          kubectl apply \
            -f k8s/backend-deployment.yaml \
            --force

          kubectl apply -f k8s/backend-service.yaml

          kubectl apply -f k8s/frontend-deployment.yaml

          kubectl apply -f k8s/frontend-service.yaml

          kubectl apply -f k8s/admin-deployment.yaml

          kubectl apply -f k8s/admin-service.yaml

          kubectl apply -f k8s/ingressclass.yaml

          kubectl apply -f k8s/ingress.yaml

          echo "Kubernetes manifests applied."


      # ═════════════════════════════════════════════════════════════
      # WAIT FOR APPLICATIONS
      # ═════════════════════════════════════════════════════════════

      - name: Wait for deployment rollouts
        shell: bash
        run: |
          set -e

          echo "Waiting for Backend..."

          kubectl rollout status \
            deployment/food-delivery-backend \
            -n food-delivery \
            --timeout=180s

          echo "Waiting for Frontend..."

          kubectl rollout status \
            deployment/food-delivery-frontend \
            -n food-delivery \
            --timeout=120s

          echo "Waiting for Admin..."

          kubectl rollout status \
            deployment/food-delivery-admin \
            -n food-delivery \
            --timeout=120s

          echo "All deployments are ready."


      # ═════════════════════════════════════════════════════════════
      # DATABASE SEED
      # ═════════════════════════════════════════════════════════════

      - name: Seed database
        shell: bash
        run: |
          echo "Seeding database..."

          kubectl exec \
            deployment/food-delivery-backend \
            -n food-delivery \
            -- /nodejs/bin/node seed.js || true

          echo "Database seed step completed."


      # ═════════════════════════════════════════════════════════════
      # DEPLOYMENT INFORMATION
      # ═════════════════════════════════════════════════════════════

      - name: Get deployment info
        if: always()
        shell: bash
        run: |

          echo "========================================"
          echo "DEPLOYMENT STATUS"
          echo "========================================"

          kubectl get pods \
            -n food-delivery

          echo ""

          echo "========================================"
          echo "SERVICES"
          echo "========================================"

          kubectl get svc \
            -n food-delivery

          echo ""

          echo "========================================"
          echo "INGRESS / ALB"
          echo "========================================"

          kubectl get ingress \
            -n food-delivery


  # ═══════════════════════════════════════════════════════════════════
  # STAGE 9: DAST — OWASP ZAP
  # ═══════════════════════════════════════════════════════════════════

  dast-scan:
    name: "Stage 9: DAST (OWASP ZAP)"
    runs-on: ubuntu-latest

    needs:
      - deploy

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Get ALB URL from EKS
        id: get-url
        shell: bash
        run: |

          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER_NAME }} \
            --region ${{ vars.AWS_REGION }}

          echo "Waiting for ALB to be provisioned..."

          sleep 90

          ALB_URL=$(kubectl get ingress \
            food-delivery-ingress \
            -n food-delivery \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' \
            2>/dev/null || echo "")

          if [ -z "$ALB_URL" ]; then

            echo "ALB not ready yet."

            echo "Using APP_URL instead."

            ALB_URL="${{ vars.APP_URL }}"

          fi

          echo "APP_TARGET_URL=https://$ALB_URL" >> "$GITHUB_ENV"

          echo "Target URL configured."


      - name: OWASP ZAP - Full Scan
        uses: zaproxy/action-full-scan@v0.10.0
        continue-on-error: true
        with:
          target: ${{ env.APP_TARGET_URL }}
          cmd_options: "-a"
          allow_issue_writing: false


      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: report_html.html


  # ═══════════════════════════════════════════════════════════════════
  # STAGE 10: RUNTIME MONITORING — FALCO
  # ═══════════════════════════════════════════════════════════════════

  runtime-validation:
    name: "Stage 10: Runtime Security (Falco Validation)"
    runs-on: ubuntu-latest

    needs:
      - deploy

    steps:

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER_NAME }} \
            --region ${{ vars.AWS_REGION }}


      # ═════════════════════════════════════════════════════════════
      # CHECK FALCO
      # ═════════════════════════════════════════════════════════════

      - name: Verify Falco is running
        shell: bash
        run: |

          echo "Checking Falco DaemonSet status..."

          if ! kubectl get daemonset falco -n falco >/dev/null 2>&1; then

            echo "WARNING: Falco not installed."

            echo "Skipping runtime validation."

            exit 0

          fi

          DESIRED=$(kubectl get daemonset falco \
            -n falco \
            -o jsonpath='{.status.desiredNumberScheduled}')

          READY=$(kubectl get daemonset falco \
            -n falco \
            -o jsonpath='{.status.numberReady}')

          if [ "$DESIRED" != "$READY" ]; then

            echo "WARNING: Falco not fully running."

            echo "Desired: $DESIRED"

            echo "Ready: $READY"

          fi

          echo "Falco is running on $READY nodes."


      # ═════════════════════════════════════════════════════════════
      # CHECK CRITICAL ALERTS
      # ═════════════════════════════════════════════════════════════

      - name: Check for critical Falco alerts post-deployment
        shell: bash
        run: |

          echo "Checking for critical Falco alerts..."

          CRITICAL_ALERTS=$(
            kubectl logs \
              -n falco \
              -l app.kubernetes.io/name=falco \
              --since=5m \
              2>/dev/null |
            grep -i "Critical" |
            wc -l || echo "0"
          )

          if [ "$CRITICAL_ALERTS" -gt "0" ]; then

            echo "WARNING: $CRITICAL_ALERTS critical Falco alerts detected!"

            kubectl logs \
              -n falco \
              -l app.kubernetes.io/name=falco \
              --since=5m |
              grep -i "Critical" |
              tail -10

            exit 1

          fi

          echo "No critical Falco alerts."

          echo "Deployment is clean."
